<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>咖啡师日常工作模拟器 · Barista Simulator</title>
  <style>
    :root {
      --bg-dark: #181412;
      --panel-bg: rgba(34, 27, 23, 0.92);
      --border-subtle: rgba(217, 179, 130, 0.25);
      --accent-gold: #d9a05b;
      --accent-green: #4caf50;
      --accent-blue: #38bdf8;
      --text-main: #f5efe6;
      --text-muted: #b8a898;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 HUD 状态栏 */
    .hud-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
      z-index: 20;
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-badge {
      background: var(--accent-gold);
      color: #1c130d;
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .hud-instruction {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.3;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reset-top {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-reset-top:hover {
      background: rgba(217, 160, 91, 0.2);
      color: var(--text-main);
    }

    /* 步骤进度条 */
    .step-tracker {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      background: #120f0d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      overflow-x: auto;
      gap: 4px;
    }

    .step-pill {
      flex: 1;
      min-width: 68px;
      text-align: center;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .step-pill.active {
      background: rgba(217, 160, 91, 0.18);
      color: var(--accent-gold);
      border-color: var(--accent-gold);
      font-weight: 700;
    }

    .step-pill.done {
      background: rgba(76, 175, 80, 0.15);
      color: #81c784;
      border-color: rgba(76, 175, 80, 0.35);
    }

    /* 主工作台画布容器 */
    .stage-wrapper {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #2d231d 0%, #161210 100%);
    }

    svg#barista-stage {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      max-height: 820px;
      display: block;
    }

    /* SVG 交互与动画类 */
    .draggable {
      cursor: grab;
      transition: filter 0.15s ease;
    }

    .draggable:hover {
      filter: drop-shadow(0 6px 12px rgba(217, 160, 91, 0.35));
    }

    .draggable.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.65));
    }

    .draggable.locked {
      cursor: default;
    }

    .drop-zone {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, stroke-dashoffset 0.4s linear;
    }

    .drop-zone.hint {
      opacity: 0.45;
    }

    .drop-zone.highlight {
      opacity: 1;
      filter: drop-shadow(0 0 10px rgba(217, 160, 91, 0.85));
    }

    /* 机械按钮状态 */
    .machine-btn {
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .machine-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .machine-btn.ready {
      animation: pulseBtn 1.5s infinite ease-in-out;
    }

    .machine-btn.running {
      filter: drop-shadow(0 0 8px #38bdf8);
      pointer-events: none;
    }

    .machine-btn.done {
      opacity: 0.85;
      pointer-events: none;
    }

    @keyframes pulseBtn {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(217, 160, 91, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(217, 160, 91, 1)); }
    }

    @keyframes shakeGrinder {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1.5px, 1px); }
      50% { transform: translate(1.5px, -1px); }
      75% { transform: translate(-1px, -1.5px); }
    }

    .grinding-active {
      animation: shakeGrinder 0.12s infinite linear;
    }

    @keyframes steamRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0.75; }
      100% { transform: translateY(-38px) scale(1.45); opacity: 0; }
    }

    .steam-puff {
      animation: steamRise 1.1s infinite ease-out;
    }

    @keyframes swirlSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .milk-swirl-active {
      transform-origin: center;
      animation: swirlSpin 0.6s infinite linear;
    }

    /* 成品完成弹窗浮层 */
    .finish-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 11, 9, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      padding: 16px;
    }

    .finish-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .finish-card {
      background: linear-gradient(160deg, #2b211b 0%, #1b1410 100%);
      border: 1px solid var(--accent-gold);
      border-radius: 18px;
      padding: 24px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
      transform: translateY(16px);
      transition: transform 0.35s ease;
    }

    .finish-modal.visible .finish-card {
      transform: translateY(0);
    }

    .finish-card h2 {
      font-size: 20px;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }

    .finish-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .cup-showcase {
      width: 210px;
      height: 210px;
      margin: 0 auto 18px;
      background: radial-gradient(circle, rgba(217, 160, 91, 0.15) 0%, transparent 72%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-again {
      background: linear-gradient(135deg, #e0a964 0%, #b87b35 100%);
      color: #18110b;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 18px rgba(217, 160, 91, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-again:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-again:active {
      transform: translateY(1px);
    }

    @media (max-width: 640px) {
      .hud-header {
        padding: 8px 10px;
      }
      .hud-instruction {
        font-size: 12px;
      }
      .step-pill {
        font-size: 10px;
        padding: 3px 4px;
        min-width: 56px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部状态与提示 -->
  <header class="hud-header">
    <div class="hud-title">
      <span class="hud-badge" id="step-badge">步骤 1 / 7</span>
      <div class="hud-instruction" id="instruction-text">请将【手柄】拖拽至【磨豆机】接粉区</div>
    </div>
    <div class="hud-controls">
      <button class="btn-reset-top" id="btn-reset-quick" title="重新开始">重置工作台</button>
    </div>
  </header>

  <!-- 7步流程导航条 -->
  <nav class="step-tracker" id="step-tracker">
    <div class="step-pill active" data-step="0">1. 磨豆</div>
    <div class="step-pill" data-step="1">2. 压粉</div>
    <div class="step-pill" data-step="2">3. 装手柄</div>
    <div class="step-pill" data-step="3">4. 萃取</div>
    <div class="step-pill" data-step="4">5. 倒奶</div>
    <div class="step-pill" data-step="5">6. 打奶泡</div>
    <div class="step-pill" data-step="6">7. 拉花</div>
  </nav>

  <!-- 2D 咖啡吧台主画布 (统一 1200x680 坐标系) -->
  <main class="stage-wrapper">
    <svg id="barista-stage" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- 金属与木纹渐变 -->
        <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#9ca3af" />
          <stop offset="30%" stop-color="#e5e7eb" />
          <stop offset="65%" stop-color="#9ca3af" />
          <stop offset="100%" stop-color="#6b7280" />
        </linearGradient>

        <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#374151" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>

        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b5a2b" />
          <stop offset="50%" stop-color="#6b4226" />
          <stop offset="100%" stop-color="#4a2c18" />
        </linearGradient>

        <linearGradient id="counterTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4e3829" />
          <stop offset="15%" stop-color="#3a281d" />
          <stop offset="100%" stop-color="#221711" />
        </linearGradient>

        <linearGradient id="espressoStreamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#d98a3c" />
          <stop offset="50%" stop-color="#7c3f1d" />
          <stop offset="100%" stop-color="#3e1c0a" />
        </linearGradient>

        <linearGradient id="milkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f3f4f6" />
          <stop offset="50%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>

        <radialGradient id="cremaSurfaceGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c67d3b" />
          <stop offset="72%" stop-color="#9e5822" />
          <stop offset="100%" stop-color="#6e3610" />
        </radialGradient>

        <!-- 裁剪区域：奶缸内部液面 -->
        <clipPath id="pitcherClip">
          <path d="M -32,-38 L 32,-38 L 38,42 Q 38,50 28,50 L -28,50 Q -38,50 -38,42 Z" />
        </clipPath>

        <!-- 裁剪区域：咖啡杯内部 -->
        <clipPath id="cupInnerClip">
          <path d="M -38,-22 L 38,-22 L 31,26 Q 27,36 0,36 Q -27,36 -31,26 Z" />
        </clipPath>

        <!-- 裁剪区域：拉花俯视杯口 -->
        <clipPath id="latteArtCircleClip">
          <circle cx="0" cy="0" r="78" />
        </clipPath>
      </defs>

      <!-- ================= 背景墙面与吧台台面 ================= -->
      <g id="layer-environment">
        <!-- 咖啡馆暖色墙砖纹理背景 -->
        <rect x="0" y="0" width="1200" height="530" fill="#231b17" />
        <g stroke="#2e241f" stroke-width="2" opacity="0.55">
          <line x1="0" y1="90" x2="1200" y2="90" />
          <line x1="0" y1="180" x2="1200" y2="180" />
          <line x1="0" y1="270" x2="1200" y2="270" />
          <line x1="0" y1="360" x2="1200" y2="360" />
          <line x1="0" y1="450" x2="1200" y2="450" />
        </g>

        <!-- 吧台背景装饰架 -->
        <rect x="70" y="95" width="220" height="12" rx="4" fill="#3e2b1f" />
        <rect x="920" y="95" width="210" height="12" rx="4" fill="#3e2b1f" />
        <!-- 装饰罐 -->
        <rect x="95" y="50" width="38" height="45" rx="6" fill="#5c4033" stroke="#8b634b" stroke-width="1.5" />
        <rect x="145" y="58" width="34" height="37" rx="5" fill="#4a3525" stroke="#8b634b" stroke-width="1.5" />
        <rect x="950" y="52" width="44" height="43" rx="6" fill="#3b4d3b" stroke="#688468" stroke-width="1.5" />
        <rect x="1010" y="60" width="36" height="35" rx="5" fill="#6b4423" stroke="#9c6a3e" stroke-width="1.5" />

        <!-- 吧台桌面 -->
        <rect x="0" y="510" width="1200" height="22" fill="#5c4130" />
        <rect x="0" y="532" width="1200" height="148" fill="url(#counterTopGrad)" />
        <!-- 压粉垫 (Tamping Mat) -->
        <rect x="330" y="515" width="170" height="18" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
        <!-- 吧台区域标签 -->
        <text x="180" y="655" fill="#8c7662" font-size="13" text-anchor="middle" letter-spacing="2">研磨区 GRINDER</text>
        <text x="605" y="655" fill="#8c7662" font-size="13" text-anchor="middle" letter-spacing="2">意式咖啡机 ESPRESSO MACHINE</text>
        <text x="1015" y="655" fill="#8c7662" font-size="13" text-anchor="middle" letter-spacing="2">奶泡与拉花台 MILK &amp; POUR</text>
      </g>

      <!-- ================= 固定设备 1：磨豆机 (Grinder) ================= -->
      <g id="grinder-unit" transform="translate(180, 340)">
        <g id="grinder-body">
          <!-- 底座 -->
          <rect x="-72" y="135" width="144" height="36" rx="8" fill="url(#darkMetalGrad)" stroke="#4b5563" stroke-width="1.5" />
          <!-- 接粉托盘 -->
          <rect x="-45" y="128" width="90" height="8" rx="3" fill="#9ca3af" />
          <!-- 机身立柱 -->
          <path d="M -52,135 L -44,-20 L 44,-20 L 52,135 Z" fill="url(#darkMetalGrad)" stroke="#4b5563" stroke-width="1.5" />
          <!-- 刻度调节环 -->
          <rect x="-48" y="-32" width="96" height="16" rx="4" fill="url(#steelGrad)" />
          <!-- 豆仓 (Hopper) -->
          <path d="M -32,-32 L -56,-145 L 56,-145 L 32,-32 Z" fill="rgba(180, 210, 230, 0.25)" stroke="#94a3b8" stroke-width="2" />
          <!-- 豆仓里的咖啡豆 -->
          <path d="M -45,-95 Q 0,-105 45,-95 L 30,-34 L -30,-34 Z" fill="#3b2112" />
          <ellipse cx="-15" cy="-75" rx="6" ry="4" fill="#54301b" transform="rotate(20 -15 -75)" />
          <ellipse cx="12" cy="-82" rx="6" ry="4" fill="#54301b" transform="rotate(-15 12 -82)" />
          <ellipse cx="0" cy="-62" rx="6" ry="4" fill="#54301b" transform="rotate(35 0 -62)" />
          <!-- 豆仓盖子 -->
          <rect x="-60" y="-154" width="120" height="10" rx="4" fill="#1f2937" />
          <!-- 出粉口与拨叉 -->
          <path d="M -16,12 L 16,12 L 12,38 L -12,38 Z" fill="url(#steelGrad)" />
          <path d="M -28,68 L -14,68 L -14,74 L -28,74 Z" fill="#d1d5db" />
          <path d="M 14,68 L 28,68 L 28,74 L 14,74 Z" fill="#d1d5db" />
        </g>

        <!-- 下落咖啡粉粒子流 -->
        <g id="coffee-grounds-stream" opacity="0">
          <rect x="-7" y="38" width="14" height="44" fill="#4a2816" rx="4" />
          <circle cx="-4" cy="48" r="2.2" fill="#2c160b" />
          <circle cx="4" cy="58" r="2.5" fill="#63361e" />
          <circle cx="-2" cy="68" r="2" fill="#2c160b" />
          <circle cx="3" cy="76" r="2.2" fill="#4a2816" />
        </g>

        <!-- 磨豆启动按钮 -->
        <g id="btn-grind" class="machine-btn disabled" transform="translate(0, 108)">
          <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#1f2937" stroke="#d9a05b" stroke-width="2" />
          <circle cx="-16" cy="0" r="5" fill="#d9a05b" id="grind-led" />
          <text x="8" y="4" fill="#f5efe6" font-size="11" font-weight="bold" text-anchor="middle">磨豆</text>
        </g>
      </g>

      <!-- ================= 固定设备 2：半自动意式咖啡机 ================= -->
      <g id="espresso-machine" transform="translate(605, 310)">
        <!-- 机身主体外壳 -->
        <rect x="-175" y="-140" width="350" height="340" rx="18" fill="url(#steelGrad)" stroke="#4b5563" stroke-width="2" />
        <!-- 顶部温杯架栏杆 -->
        <rect x="-165" y="-154" width="330" height="14" rx="4" fill="#1f2937" />
        <line x1="-155" y1="-162" x2="155" y2="-162" stroke="#d1d5db" stroke-width="3" />
        <line x1="-150" y1="-162" x2="-150" y2="-154" stroke="#d1d5db" stroke-width="3" />
        <line x1="0" y1="-162" x2="0" y2="-154" stroke="#d1d5db" stroke-width="3" />
        <line x1="150" y1="-162" x2="150" y2="-154" stroke="#d1d5db" stroke-width="3" />

        <!-- 前面板控制区（深色拉丝面板） -->
        <rect x="-155" y="-120" width="310" height="82" rx="10" fill="url(#darkMetalGrad)" stroke="#374151" stroke-width="1.5" />

        <!-- 压力表 (Pressure Gauge) -->
        <g transform="translate(0, -79)">
          <circle cx="0" cy="0" r="28" fill="#f8fafc" stroke="#9ca3af" stroke-width="3" />
          <path d="M -18,12 A 21,21 0 1,1 18,12" fill="none" stroke="#94a3b8" stroke-width="2" />
          <!-- 9 Bar 绿色最佳萃取区间 -->
          <path d="M 6,-20 A 21,21 0 0,1 20,-4" fill="none" stroke="#22c55e" stroke-width="4" />
          <line id="pressure-needle" x1="0" y1="0" x2="-14" y2="12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="0" r="3.5" fill="#1e293b" />
          <text x="0" y="16" fill="#475569" font-size="8" font-weight="bold" text-anchor="middle">9 BAR</text>
        </g>

        <!-- 萃取按钮 (Brew Button) -->
        <g id="btn-brew" class="machine-btn disabled" transform="translate(-85, -79)">
          <rect x="-42" y="-20" width="84" height="40" rx="10" fill="#1e293b" stroke="#d9a05b" stroke-width="2" />
          <circle cx="-22" cy="0" r="6" fill="#d9a05b" id="brew-led" />
          <text x="10" y="4" fill="#f5efe6" font-size="13" font-weight="bold" text-anchor="middle">萃取</text>
        </g>

        <!-- 打奶蒸汽按钮 (Steam Button) -->
        <g id="btn-steam" class="machine-btn disabled" transform="translate(85, -79)">
          <rect x="-42" y="-20" width="84" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <circle cx="-22" cy="0" r="6" fill="#38bdf8" id="steam-led" />
          <text x="10" y="4" fill="#f5efe6" font-size="13" font-weight="bold" text-anchor="middle">打奶</text>
        </g>

        <!-- 机器中下部凹陷工作腔 -->
        <rect x="-150" y="-30" width="300" height="195" rx="8" fill="#1f242d" />

        <!-- 冲煮头 (Group Head) 位于 (-55, -10) 相对坐标 -> 全局 (550, 300) -->
        <g id="group-head" transform="translate(-55, -18)">
          <rect x="-38" y="-12" width="76" height="24" rx="4" fill="url(#steelGrad)" stroke="#374151" stroke-width="1.5" />
          <rect x="-30" y="12" width="60" height="14" rx="2" fill="#4b5563" />
        </g>

        <!-- 蒸汽棒 (Steam Wand) 位于 (95, -18) 相对坐标 -> 全局 (700, 292) -->
        <g id="steam-wand" transform="translate(95, -18)">
          <rect x="-12" y="-12" width="24" height="18" rx="4" fill="#6b7280" />
          <path d="M 0,6 L 0,48 L 12,88" fill="none" stroke="url(#steelGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          <!-- 防烫胶套 -->
          <line x1="0" y1="22" x2="0" y2="42" stroke="#111827" stroke-width="9" stroke-linecap="round" />
          <!-- 蒸汽喷嘴 -->
          <circle cx="12" cy="90" r="4.5" fill="#9ca3af" />
        </g>

        <!-- 滴水盘 (Drip Tray) -->

        lattePourStream: document.getElementById('latte-pour-stream'),
        pitcherMilkRect: document.getElementById('pitcher-milk-rect'),
        pitcherFoamRect: document.getElementById('pitcher-foam-rect'),
        pitcherSwirl: document.getElementById('pitcher-swirl'),
        pitcherTempBar: document.getElementById('pitcher-temp-bar'),
        steamClouds: document.getElementById('steam-clouds'),
        latteArtOverlay: document.getElementById('latte-art-overlay'),
        latteArtCanvas: document.getElementById('latte-art-canvas'),
        latteArtLabel: document.getElementById('latte-art-label')
      };

      // =========================================================================
      // 3. 工具函数：坐标转换、变换管理与定时器清理
      // =========================================================================
      function clientToSvgPoint(clientX, clientY) {
        const pt = dom.svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        const ctm = dom.svg.getScreenCTM();
        if (!ctm) return { x: 0, y: 0 };
        return pt.matrixTransform(ctm.inverse());
      }

      function setItemTransform(el, x, y, rotateDeg = 0) {
        el.dataset.x = x;
        el.dataset.y = y;
        el.dataset.rot = rotateDeg;
        if (rotateDeg !== 0) {
          el.setAttribute('transform', `translate(${x}, ${y}) rotate(${rotateDeg})`);
        } else {
          el.setAttribute('transform', `translate(${x}, ${y})`);
        }
      }

      function getItemPos(el) {
        return {
          x: parseFloat(el.dataset.x || 0),
          y: parseFloat(el.dataset.y || 0)
        };
      }

      function getDistance(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
      }

      function registerTimeout(fn, delay) {
        const id = setTimeout(() => {
          state.activeTimers = state.activeTimers.filter(t => t !== id);
          fn();
        }, delay);
        state.activeTimers.push(id);
        return id;
      }

      function animateProgress(durationMs, onUpdate, onComplete) {
        const start = performance.now();
        let rafId = null;
        function frame(now) {
          const elapsed = now - start;
          const t = Math.min(1, Math.max(0, elapsed / durationMs));
          onUpdate(t);
          if (t < 1) {
            rafId = requestAnimationFrame(frame);
            state.activeRafs.push(rafId);
          } else {
            state.activeRafs = state.activeRafs.filter(r => r !== rafId);
            if (onComplete) onComplete();
          }
        }
        rafId = requestAnimationFrame(frame);
        state.activeRafs.push(rafId);
      }

      function clearAllAsync() {
        state.activeTimers.forEach(id => clearTimeout(id));
        state.activeTimers = [];
        state.activeRafs.forEach(id => cancelAnimationFrame(id));
        state.activeRafs = [];
      }

      // =========================================================================
      // 4. 有限状态机 (FSM) 与 UI 同步
      // =========================================================================
      function setButtonState(btnEl, status) {
        btnEl.classList.remove('disabled', 'ready', 'running', 'done');
        btnEl.classList.add(status);
      }

      function hideAllDropZones() {
        Object.values(dom.dz).forEach(dz => {
          dz.classList.remove('hint', 'highlight');
        });
      }

      function updateUI() {
        const stepObj = STEPS[state.currentStepIndex];
        dom.stepBadge.textContent = stepObj.badge;

        // 更新顶部步骤条样式
        dom.stepPills.forEach((pill, idx) => {
          pill.classList.remove('active', 'done');
          if (idx < state.currentStepIndex) {
            pill.classList.add('done');
          } else if (idx === state.currentStepIndex) {
            pill.classList.add('active');
          }
        });

        hideAllDropZones();

        // 根据当前状态机阶段更新按钮状态、热区提示与操作文案
        setButtonState(dom.buttons.grind, state.hasGrounds ? 'done' : 'disabled');
        setButtonState(dom.buttons.brew, state.hasEspresso ? 'done' : 'disabled');
        setButtonState(dom.buttons.steam, state.isSteamed ? 'done' : 'disabled');

        // 更新拖拽锁定状态
        Object.values(dom.items).forEach(el => el.classList.remove('locked'));
        if (state.portafilterMounted) {
          dom.items.portafilter.classList.add('locked');
        }

        if (state.isBusy) {
          dom.instructionText.textContent = stepObj.runningText || '正在执行操作...';
          return;
        }

        switch (stepObj.id) {
          case 'STEP_1_GRIND':
            if (!state.portafilterSnappedAtGrinder) {
              dom.instructionText.textContent = stepObj.hintDrag;
              dom.dz.grinder.classList.add('hint');
            } else {
              dom.instructionText.textContent = stepObj.hintAction;
              setButtonState(dom.buttons.grind, 'ready');
            }
            break;

          case 'STEP_2_TAMP': {
            dom.instructionText.textContent = stepObj.hintDrag;
            const pfPos = getItemPos(dom.items.portafilter);
            setItemTransform(dom.dz.tamp, pfPos.x, pfPos.y);
            dom.dz.tamp.classList.add('hint');
            break;
          }

          case 'STEP_3_MOUNT':
            dom.instructionText.textContent = stepObj.hintDrag;
            dom.dz.grouphead.classList.add('hint');
            break;

          case 'STEP_4_BREW':
            if (!state.cupUnderSpout) {
              dom.instructionText.textContent = stepObj.hintNeedCup;
              dom.dz.brewcup.classList.add('hint');
            } else {
              dom.instructionText.textContent = stepObj.hintAction;
              setButtonState(dom.buttons.brew, 'ready');
            }
            break;

          case 'STEP_5_POUR_MILK': {
            dom.instructionText.textContent = stepObj.hintDrag;
            const pitcherPos = getItemPos(dom.items.pitcher);
            setItemTransform(dom.dz.pourmilk, pitcherPos.x, pitcherPos.y - 68);
            dom.dz.pourmilk.classList.add('hint');
            break;
          }

          case 'STEP_6_STEAM':
            if (!state.pitcherAtSteam) {
              dom.instructionText.textContent = stepObj.hintDrag;
              dom.dz.steam.classList.add('hint');
            } else {
              dom.instructionText.textContent = stepObj.hintAction;
              setButtonState(dom.buttons.steam, 'ready');
            }
            break;

          case 'STEP_7_LATTE_ART': {
            dom.instructionText.textContent = stepObj.hintDrag;
            const cupPos = getItemPos(dom.items.cup);
            setItemTransform(dom.dz.latteart, cupPos.x, cupPos.y - 58);
            dom.dz.latteart.classList.add('hint');
            break;
          }

          case 'STEP_DONE':
            dom.instructionText.textContent = stepObj.hintDrag;
            break;
        }
      }

      // =========================================================================
      // 5. 各步骤动作执行器（动画 + 状态迁移）
      // =========================================================================

      // 步骤 1：磨豆执行
      function executeGrind() {
        if (state.isBusy || state.currentStepIndex !== 0 || !state.portafilterSnappedAtGrinder) return;
        state.isBusy = true;
        setButtonState(dom.buttons.grind, 'running');
        updateUI();

        dom.grinderBody.classList.add('grinding-active');
        dom.groundsStream.setAttribute('opacity', '1');

        animateProgress(2200, (t) => {
          // 咖啡粉逐渐在手柄粉碗中隆起
          dom.pfGroundsLoose.setAttribute('opacity', Math.min(1, t * 1.4).toFixed(2));
          const peakY = -12 - 18 * t;
          dom.pfGroundsLoose.setAttribute('d', `M -26,-12 Q 0,${peakY} 26,-12 Z`);
        }, () => {
          dom.grinderBody.classList.remove('grinding-active');
          dom.groundsStream.setAttribute('opacity', '0');
          state.hasGrounds = true;
          state.isBusy = false;
          state.currentStepIndex = 1; // 进入步骤 2：压粉
          updateUI();
        });
      }

      // 步骤 2：压粉执行
      function executeTamp() {
        if (state.isBusy || state.currentStepIndex !== 1 || !state.hasGrounds) return;
        state.isBusy = true;
        hideAllDropZones();
        updateUI();

        const pfPos = getItemPos(dom.items.portafilter);
        // 将压粉锤对齐到手柄正上方
        setItemTransform(dom.items.tamper, pfPos.x, pfPos.y - 42);

        animateProgress(1100, (t) => {
          // 前半段下压，后半段抬起
          const press = t < 0.5 ? (t * 2) : (1 - (t - 0.5) * 2);
          const tamperY = (pfPos.y - 42) + press * 18;
          setItemTransform(dom.items.tamper, pfPos.x, tamperY);

          if (t >= 0.45) {
            dom.pfGroundsLoose.setAttribute('opacity', '0');
            dom.pfGroundsTamped.setAttribute('opacity', '1');
          }
        }, () => {
          // 压粉锤归位
          setItemTransform(dom.items.tamper, INITIAL_POS.tamper.x, INITIAL_POS.tamper.y);
          state.isTamped = true;
          state.isBusy = false;
          state.currentStepIndex = 2; // 进入步骤 3：安装手柄
          updateUI();
        });
      }

      // 步骤 4：意式浓缩萃取执行
      function executeBrew() {
        if (state.isBusy || state.currentStepIndex !== 3 || !state.portafilterMounted || !state.cupUnderSpout) return;
        state.isBusy = true;
        setButtonState(dom.buttons.brew, 'running');
        updateUI();

        dom.espressoStreams.setAttribute('opacity', '1');

        animateProgress(3000, (t) => {
          // 压力表指针升至 9 Bar（角度从 -135deg 转到 +35deg）
          const angleDeg = -135 + Math.min(1, t * 3) * 170;
          const rad = (angleDeg * Math.PI) / 180;
          dom.pressureNeedle.setAttribute('x2', (Math.cos(rad) * 18).toFixed(1));
          dom.pressureNeedle.setAttribute('y2', (Math.sin(rad) * 18).toFixed(1));

          // 咖啡杯内液面与油脂上升（底部 y=36，最大高度 36）
          const totalH = 34 * t;
          const cremaH = Math.min(7, totalH * 0.25);
          const liquidH = Math.max(0, totalH - cremaH);

          dom.cupLiquidRect.setAttribute('y', (36 - liquidH).toFixed(1));
          dom.cupLiquidRect.setAttribute('height', liquidH.toFixed(1));

          dom.cupCremaRect.setAttribute('y', (36 - totalH).toFixed(1));
          dom.cupCremaRect.setAttribute('height', cremaH.toFixed(1));
        }, () => {
          dom.espressoStreams.setAttribute('opacity', '0');
          // 压力表回落
          dom.pressureNeedle.setAttribute('x2', '-14');
          dom.pressureNeedle.setAttribute('y2', '12');

          state.hasEspresso = true;
          state.isBusy = false;
          state.currentStepIndex = 4; // 进入步骤 5：倒奶
          updateUI();
        });
      }

      // 步骤 5：牛奶倒入奶缸
      function executePourMilk() {
        if (state.isBusy || state.currentStepIndex !== 4) return;
        state.isBusy = true;
        hideAllDropZones();
        updateUI();

        const pitcherPos = getItemPos(dom.items.pitcher);
        const bottleX = pitcherPos.x + 56;
        const bottleY = pitcherPos.y - 96;
        setItemTransform(dom.items.milk, bottleX, bottleY, -62);

        // 奶流起点（倾斜瓶口）与终点（奶缸底部）
        const spoutX = bottleX - 48;
        const spoutY = bottleY - 22;
        dom.milkPourStream.setAttribute('d', `M ${spoutX},${spoutY} Q ${pitcherPos.x + 4},${spoutY + 12} ${pitcherPos.x},${pitcherPos.y + 38}`);
        dom.milkPourStream.setAttribute('opacity', '1');

        animateProgress(2000, (t) => {
          // 奶缸液面上升至预设容量（高度 46，底部 y=50）
          const milkH = 46 * t;
          dom.pitcherMilkRect.setAttribute('y', (50 - milkH).toFixed(1));
          dom.pitcherMilkRect.setAttribute('height', milkH.toFixed(1));
        }, () => {
          dom.milkPourStream.setAttribute('opacity', '0');
          setItemTransform(dom.items.milk, INITIAL_POS.milk.x, INITIAL_POS.milk.y, 0);
          state.hasMilk = true;
          state.isBusy = false;
          state.currentStepIndex = 5; // 进入步骤 6：打奶
          updateUI();
        });
      }

      // 步骤 6：蒸汽打发奶泡
      function executeSteamMilk() {
        if (state.isBusy || state.currentStepIndex !== 5 || !state.pitcherAtSteam) return;
        state.isBusy = true;
        setButtonState(dom.buttons.steam, 'running');
        updateUI();

        dom.steamClouds.setAttribute('opacity', '1');
        dom.pitcherSwirl.setAttribute('opacity', '1');
        dom.pitcherSwirl.classList.add('milk-swirl-active');

        animateProgress(2800, (t) => {
          // 奶泡膨胀：总高度从 46 膨胀至 64，顶部出现绵密奶泡层
          const totalH = 46 + 18 * t;
          const foamH = 16 * t;
          const milkH = totalH - foamH;

          dom.pitcherMilkRect.setAttribute('y', (50 - milkH).toFixed(1));
          dom.pitcherMilkRect.setAttribute('height', milkH.toFixed(1));

          dom.pitcherFoamRect.setAttribute('y', (50 - totalH).toFixed(1));
          dom.pitcherFoamRect.setAttribute('height', foamH.toFixed(1));

          // 温度贴纸进度条变化（冷蓝 -> 理想 60°C 绿色）
          const barW = 4 + 28 * t;
          dom.pitcherTempBar.setAttribute('width', barW.toFixed(1));
          if (t > 0.7) {
            dom.pitcherTempBar.setAttribute('fill', '#22c55e');
          } else if (t > 0.35) {
            dom.pitcherTempBar.setAttribute('fill', '#eab308');
          }
        }, () => {
          dom.steamClouds.setAttribute('opacity', '0');
          dom.pitcherSwirl.setAttribute('opacity', '0');
          dom.pitcherSwirl.classList.remove('milk-swirl-active');

          state.isSteamed = true;
          state.isBusy = false;
          state.currentStepIndex = 6; // 进入步骤 7：拉花
          updateUI();
        });
      }

      // =========================================================================
      // 6. 拉花系统（5种预设图案 + 连续渐进动画绘制）
      // =========================================================================
      function createSvgEl(tag, attrs = {}) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          el.setAttribute(k, v);
        }
        return el;
      }

      /**
       * 根据图案类型与进度 progress (0 -> 1) 渲染连续渐进的拉花图形
       */
      function renderLatteArtFrame(container, patternKey, progress) {
        container.innerHTML = '';

        // 阶段一 (0 ~ 0.25)：融合期（融合白圈扩散并融入油脂）
        const fusionT = Math.min(1, progress / 0.25);
        const fusionCircle = createSvgEl('circle', {
          cx: 0,
          cy: 0,
          r: (12 + fusionT * 46).toFixed(1),
          fill: '#f7efe5',
          opacity: (0.45 * (1 - progress * 0.65)).toFixed(2)
        });
        container.appendChild(fusionCircle);

        if (progress <= 0.18) return;

        // 阶段二 (0.18 ~ 1.0)：主图案成型与收尾拉切
        const drawT = Math.min(1, (progress - 0.18) / 0.82);

        if (patternKey === 'heart') {
          // 1. 经典爱心 (Heart)
          const scale = 0.15 + 0.85 * Math.min(1, drawT / 0.8);
          const g = createSvgEl('g', { transform: `scale(${scale.toFixed(3)})` });
          // 爱心主体
          const heartPath = createSvgEl('path', {
            d: 'M 0,-36 C -22,-62 -60,-38 -52,-4 C -44,26 0,52 0,56 C 0,52 44,26 52,-4 C 60,-38 22,-62 0,-36 Z',
            fill: '#ffffff'
          });
          // 内部克丽玛对比纹理
          const innerRing = createSvgEl('path', {
            d: 'M 0,-22 C -14,-40 -38,-24 -32,-2 C -26,16 0,34 0,36 C 0,34 26,16 32,-2 C 38,-24 14,-40 0,-22 Z',
            fill: 'none',
            stroke: '#d69e66',
            'stroke-width': '2.5',
            opacity: '0.65'
          });
          g.appendChild(heartPath);
          g.appendChild(innerRing);

          // 收尾拉切线 (0.8 ~ 1.0)
          if (drawT > 0.78) {
            const cutT = (drawT - 0.78) / 0.22;
            const cutLine = createSvgEl('line', {
              x1: 0,
              y1: -50,
              x2: 0,
              y2: (-50 + cutT * 112).toFixed(1),
              stroke: '#9e5822',
              'stroke-width': '3',
              'stroke-linecap': 'round'
            });
            g.appendChild(cutLine);
          }
          container.appendChild(g);

        } else if (patternKey === 'tulip') {
          // 2. 多层郁金香 (Tulip - 4层叠加推心)
          const layers = [
            { y: 26, rx: 38, ry: 22, start: 0.0 },
            { y: 6, rx: 33, ry: 20, start: 0.22 },
            { y: -14, rx: 27, ry: 17, start: 0.44 },
            { y: -32, rx: 20, ry: 15, start: 0.64 }
          ];
          layers.forEach((l) => {
            if (drawT > l.start) {
              const lt = Math.min(1, (drawT - l.start) / 0.25);
              const path = createSvgEl('path', {
                d: `M 0,${l.y - l.ry * 0.4 * lt} C ${-l.rx * lt},${l.y - l.ry * 1.4 * lt} ${-l.rx * 1.15 * lt},${l.y + l.ry * 0.5 * lt} 0,${l.y + l.ry * lt} C ${l.rx * 1.15 * lt},${l.y + l.ry * 0.5 * lt} ${l.rx * lt},${l.y - l.ry * 1.4 * lt} 0,${l.y - l.ry * 0.4 * lt} Z`,
                fill: '#ffffff',
                stroke: '#c67d3b',
                'stroke-width': '1.5'
              });
              container.appendChild(path);
            }
          });
          // 贯穿中心拉切
          if (drawT > 0.82) {
            const cutT = (drawT - 0.82) / 0.18;
            container.appendChild(createSvgEl('line', {
              x1: 0,
              y1: -48,
              x2: 0,
              y2: (-48 + cutT * 104).toFixed(1),
              stroke: '#8a4818',
              'stroke-width': '3',
              'stroke-linecap': 'round'
            }));
          }

        } else if (patternKey === 'rosetta') {
          // 3. 细腻树叶 (Rosetta - 底部底座 + 左右摆动叶片 + 顶部心尖)
          const leafPairs = 7;
          const bodyT = Math.min(1, drawT / 0.82);
          const visiblePairs = Math.ceil(bodyT * leafPairs);

          // 底部包裹底座
          if (bodyT > 0.05) {
            const baseScale = Math.min(1, bodyT * 3);
            container.appendChild(createSvgEl('path', {
              d: 'M -34,26 Q 0,62 34,26 Q 16,38 0,36 Q -16,38 -34,26 Z',
              fill: '#ffffff',
              transform: `scale(${baseScale.toFixed(2)})`
            }));
          }

          // 逐层生长的左右叶片
          for (let i = 0; i < visiblePairs; i++) {
            const pairProgress = Math.min(1, (bodyT * leafPairs - i));
            const y = 26 - i * 9.5;
            const spanX = (38 - i * 3.8) * pairProgress;
            const curveY = 7 * pairProgress;

            const leftLeaf = createSvgEl('path', {
              d: `M 0,${y} Q ${-spanX * 0.6},${y - curveY * 1.4} ${-spanX},${y + curveY * 0.3} Q ${-spanX * 0.5},${y + curveY * 1.3} 0,${y + 2}`,
              fill: '#ffffff'
            });
            const rightLeaf = createSvgEl('path', {
              d: `M 0,${y} Q ${spanX * 0.6},${y - curveY * 1.4} ${spanX},${y + curveY * 0.3} Q ${spanX * 0.5},${y + curveY * 1.3} 0,${y + 2}`,
              fill: '#ffffff'
            });
            container.appendChild(leftLeaf);
            container.appendChild(rightLeaf);
          }

          // 顶部小爱心收尾与中心叶脉拉切
          if (drawT > 0.75) {
            const topT = (drawT - 0.75) / 0.25;
            container.appendChild(createSvgEl('path', {
              d: 'M 0,-46 C -8,-56 -20,-46 -16,-35 C -12,-26 0,-18 0,-18 C 0,-18 12,-26 16,-35 C 20,-46 8,-56 0,-46 Z',
              fill: '#ffffff',
              opacity: topT.toFixed(2)
            }));
            container.appendChild(createSvgEl('line', {
              x1: 0,
              y1: -50,
              x2: 0,
              y2: (-50 + topT * 96).toFixed(1),
              stroke: '#8a4818',
              'stroke-width': '2.6',
              'stroke-linecap': 'round'
            }));
          }

        } else if (patternKey === 'swan') {
          // 4. 优雅天鹅 (Swan - 羽翼 + 优雅S型天鹅颈 + 头部)
          // 天鹅翅膀（波浪羽翼）
          const wingT = Math.min(1, drawT / 0.55);
          for (let i = 0; i < 6; i++) {
            if (wingT > i / 6) {
              const lt = Math.min(1, (wingT - i / 6) * 6);
              const wy = 34 - i * 8.5;
              const wx = (36 - i * 3) * lt;
              container.appendChild(createSvgEl('path', {
                d: `M -10,${wy} Q ${-10 - wx * 0.6},${wy - 8} ${-10 - wx},${wy + 4} Q ${-10 - wx * 0.5},${wy + 10} -8,${wy + 3} Z`,
                fill: '#ffffff'
              }));
            }
          }
          // 天鹅身体基座
          if (drawT > 0.35) {
            const bodyT = Math.min(1, (drawT - 0.35) / 0.3);
            container.appendChild(createSvgEl('path', {
              d: 'M -36,34 Q -8,58 26,38 Q 10,24 -12,28 Z',
              fill: '#ffffff',
              opacity: bodyT.toFixed(2)
            }));
          }
          // 天鹅颈与头（S形曲线沿路径伸展）
          if (drawT > 0.55) {
            const neckT = Math.min(1, (drawT - 0.55) / 0.45);
            const neckPath = createSvgEl('path', {
              d: 'M 14,34 C 34,16 4,-12 24,-34 C 30,-41 40,-38 42,-31',
              fill: 'none',
              stroke: '#ffffff',
              'stroke-width': '7.5',
              'stroke-linecap': 'round',
              'stroke-dasharray': '115',
              'stroke-dashoffset': (115 * (1 - neckT)).toFixed(1)
            });
            container.appendChild(neckPath);

            if (neckT > 0.85) {
              // 天鹅头部与尖喙
              container.appendChild(createSvgEl('circle', {
                cx: 41,
                cy: -31,
                r: 5.5,
                fill: '#ffffff'
              }));
              container.appendChild(createSvgEl('polygon', {
                points: '45,-32 53,-28 45,-28',
                fill: '#f59e0b'
              }));
            }
          }

        } else if (patternKey === 'combo') {
          // 5. 组合花型：天鹅拥心 (Swan & Heart Combo - 左侧优雅天鹅 + 右侧双层小爱心)
          // 左侧天鹅羽翼与长颈
          const leftT = Math.min(1, drawT / 0.6);
          for (let i = 0; i < 5; i++) {
            if (leftT > i / 5) {
              const lt = Math.min(1, (leftT - i / 5) * 5);
              const wy = 28 - i * 8;
              const wx = (28 - i * 2.5) * lt;
              container.appendChild(createSvgEl('path', {
                d: `M -16,${wy} Q ${-16 - wx * 0.6},${wy - 7} ${-16 - wx},${wy + 3} Q ${-16 - wx * 0.5},${wy + 8} -14,${wy + 2} Z`,
                fill: '#ffffff'
              }));
            }
          }
          if (drawT > 0.25) {
            const neckT = Math.min(1, (drawT - 0.25) / 0.45);
            container.appendChild(createSvgEl('path', {
              d: 'M -12,28 C 2,14 -18,-10 -2,-30 C 4,-36 12,-33 14,-27',
              fill: 'none',
              stroke: '#ffffff',
              'stroke-width': '6',
              'stroke-linecap': 'round',
              'stroke-dasharray': '95',
              'stroke-dashoffset': (95 * (1 - neckT)).toFixed(1)
            }));
            if (neckT > 0.85) {
              container.appendChild(createSvgEl('circle', { cx: 14, cy: -27, r: 4.5, fill: '#ffffff' }));
            }
          }

          // 右侧双层爱心组合
          if (drawT > 0.5) {
            const heartT = Math.min(1, (drawT - 0.5) / 0.5);
            const h1Scale = Math.min(1, heartT * 1.4);
            container.appendChild(createSvgEl('path', {
              d: 'M 28,-8 C 18,-20 2,-10 6,4 C 9,16 28,28 28,30 C 28,28 47,16 50,4 C 54,-10 38,-20 28,-8 Z',
              fill: '#ffffff',
              transform: `translate(28, 10) scale(${h1Scale.toFixed(2)}) translate(-28, -10)`
            }));

            if (heartT > 0.45) {
              const h2Scale = (heartT - 0.45) / 0.55;
              container.appendChild(createSvgEl('path', {
                d: 'M 26,-32 C 20,-40 10,-33 13,-24 C 15,-16 26,-9 26,-9 C 26,-9 37,-16 39,-24 C 42,-33 32,-40 26,-32 Z',
                fill: '#ffffff',
                transform: `translate(26, -22) scale(${h2Scale.toFixed(2)}) translate(-26, 22)`
              }));
            }
          }
        }
      }

      // 步骤 7：执行拉花注入动画
      function executeLatteArt() {
        if (state.isBusy || state.currentStepIndex !== 6 || !state.isSteamed) return;
        state.isBusy = true;
        hideAllDropZones();
        updateUI();

        // 随机抽取 5 种图案之一
        const chosen = LATTE_PATTERNS[Math.floor(Math.random() * LATTE_PATTERNS.length)];
        state.selectedPattern = chosen;

        const cupPos = getItemPos(dom.items.cup);
        const pitcherStartX = cupPos.x + 88;
        const pitcherStartY = cupPos.y - 78;
        setItemTransform(dom.items.pitcher, pitcherStartX, pitcherStartY, -46);

        // 显示俯视拉花特写画布与杯口预览
        dom.latteArtOverlay.setAttribute('opacity', '1');
        dom.latteArtLabel.textContent = `注入中：${chosen.name}`;
        dom.cupTopSurface.setAttribute('opacity', '1');
        dom.cupMiniArt.setAttribute('opacity', '1');
        dom.lattePourStream.setAttribute('opacity', '1');

        animateProgress(4200, (t) => {
          // 奶缸模拟手腕左右微幅摆动注入
          const wobbleX = Math.sin(t * Math.PI * 10) * (1 - t) * 14;
          const curPitcherX = pitcherStartX + wobbleX;
          const curPitcherY = pitcherStartY + Math.sin(t * Math.PI) * 8;
          setItemTransform(dom.items.pitcher, curPitcherX, curPitcherY, -46 - Math.sin(t * Math.PI) * 8);

          // 奶缸导流嘴到杯口中心的细奶流
          const spoutX = curPitcherX - 44;
          const spoutY = curPitcherY - 12;
          const targetX = cupPos.x + wobbleX * 0.4;
          const targetY = cupPos.y - 22;
          dom.lattePourStream.setAttribute('d', `M ${spoutX},${spoutY} Q ${(spoutX + targetX) / 2 - 6},${(spoutY + targetY) / 2} ${targetX},${targetY}`);

          // 奶缸内部液面逐渐减少
          const remainH = Math.max(8, 64 * (1 - t * 0.72));
          dom.pitcherMilkRect.setAttribute('y', (50 - remainH).toFixed(1));
          dom.pitcherMilkRect.setAttribute('height', remainH.toFixed(1));
          dom.pitcherFoamRect.setAttribute('height', '0');

          // 连续绘制拉花动画（同步渲染至特写大圆与杯口小圆）
          renderLatteArtFrame(dom.latteArtCanvas, chosen.key, t);
          renderLatteArtFrame(dom.cupMiniArt, chosen.key, t);
        }, () => {
          dom.lattePourStream.setAttribute('opacity', '0');
          // 奶缸放回右侧操作台
          setItemTransform(dom.items.pitcher, INITIAL_POS.pitcher.x, INITIAL_POS.pitcher.y, 0);

          state.isBusy = false;
          state.currentStepIndex = 7; // STEP_DONE
          updateUI();

          // 展示完成弹窗与高清成品拉花
          dom.finishPatternDesc.textContent = `今日拉花作品：${chosen.name}`;
          dom.finalArtTarget.innerHTML = dom.latteArtCanvas.innerHTML;

          registerTimeout(() => {
            dom.latteArtOverlay.setAttribute('opacity', '0');
            dom.finishModal.classList.add('visible');
          }, 550);
        });
      }

      // =========================================================================
      // 7. Pointer Events 统一拖拽与吸附逻辑
      // =========================================================================
      let activeDrag = null;

      function setupDraggable(itemKey, element) {
        element.addEventListener('pointerdown', (e) => {
          if (state.isBusy) return;
          if (element.classList.contains('locked')) return;
          if (e.button !== undefined && e.button !== 0) return;

          e.preventDefault();
          element.setPointerCapture(e.pointerId);

          // 将当前拖拽元素置于图层最前方
          element.parentNode.appendChild(element);
          element.classList.add('dragging');

          const svgPt = clientToSvgPoint(e.clientX, e.clientY);
          const startPos = getItemPos(element);

          activeDrag = {
            key: itemKey,
            el: element,
            pointerId: e.pointerId,
            offsetX: svgPt.x - startPos.x,
            offsetY: svgPt.y - startPos.y,
            originX: startPos.x,
            originY: startPos.y
          };
        });

        element.addEventListener('pointermove', (e) => {
          if (!activeDrag || activeDrag.pointerId !== e.pointerId) return;
          e.preventDefault();

          const svgPt = clientToSvgPoint(e.clientX, e.clientY);
          const nx = Math.max(55, Math.min(1145, svgPt.x - activeDrag.offsetX));
          const ny = Math.max(70, Math.min(610, svgPt.y - activeDrag.offsetY));

          setItemTransform(element, nx, ny, 0);
          handleDragProximityHighlight(activeDrag.key, { x: nx, y: ny });
        });

        const endDrag = (e) => {
          if (!activeDrag || activeDrag.pointerId !== e.pointerId) return;
          e.preventDefault();

          try {
            element.releasePointerCapture(e.pointerId);
          } catch (_) { /* ignore */ }

          element.classList.remove('dragging');
          const dragInfo = activeDrag;
          activeDrag = null;

          handleDropEvaluation(dragInfo);
        };

        element.addEventListener('pointerup', endDrag);
        element.addEventListener('pointercancel', endDrag);
      }

      // 拖拽接近目标区域时实时高亮反馈
      function handleDragProximityHighlight(itemKey, pos) {
        Object.values(dom.dz).forEach(dz => dz.classList.remove('highlight'));

        const stepId = STEPS[state.currentStepIndex].id;

        if (itemKey === 'portafilter' && stepId === 'STEP_1_GRIND') {
          if (getDistance(pos, SNAP_TARGETS.grinder) < SNAP_TARGETS.grinder.radius) {
            dom.dz.grinder.classList.add('highlight');
          }
        } else if (itemKey === 'tamper' && stepId === 'STEP_2_TAMP') {
          const pfPos = getItemPos(dom.items.portafilter);
          if (getDistance(pos, { x: pfPos.x, y: pfPos.y - 25 }) < 75) {
            dom.dz.tamp.classList.add('highlight');
          }
        } else if (itemKey === 'portafilter' && stepId === 'STEP_3_MOUNT') {
          if (getDistance(pos, SNAP_TARGETS.grouphead) < SNAP_TARGETS.grouphead.radius) {
            dom.dz.grouphead.classList.add('highlight');
          }
        } else if (itemKey === 'cup' && stepId === 'STEP_4_BREW') {
          if (getDistance(pos, SNAP_TARGETS.brewcup) < SNAP_TARGETS.brewcup.radius) {
            dom.dz.brewcup.classList.add('highlight');
          }
        } else if (itemKey === 'milk' && stepId === 'STEP_5_POUR_MILK') {
          const pitcherPos = getItemPos(dom.items.pitcher);
          if (getDistance(pos, { x: pitcherPos.x, y: pitcherPos.y - 68 }) < 85) {
            dom.dz.pourmilk.classList.add('highlight');
          }
        } else if (itemKey === 'pitcher' && stepId === 'STEP_6_STEAM') {
          if (getDistance(pos, SNAP_TARGETS.steam) < SNAP_TARGETS.steam.radius) {
            dom.dz.steam.classList.add('highlight');
          }
        } else if (itemKey === 'pitcher' && stepId === 'STEP_7_LATTE_ART') {
          const cupPos = getItemPos(dom.items.cup);
          if (getDistance(pos, { x: cupPos.x, y: cupPos.y - 58 }) < 85) {
            dom.dz.latteart.classList.add('highlight');
          }
        }
      }

      // 松手释放判定：匹配前置条件与热区则吸附/执行，否则回弹原位
      function handleDropEvaluation(dragInfo) {
        const pos = getItemPos(dragInfo.el);
        const stepId = STEPS[state.currentStepIndex].id;
        let matched = false;

        if (dragInfo.key === 'portafilter') {
          if (stepId === 'STEP_1_GRIND' && getDistance(pos, SNAP_TARGETS.grinder) < SNAP_TARGETS.grinder.radius) {
            // 吸附到磨豆机接粉区
            setItemTransform(dragInfo.el, SNAP_TARGETS.grinder.x, SNAP_TARGETS.grinder.y);
            state.portafilterSnappedAtGrinder = true;
            matched = true;
          } else if (stepId === 'STEP_3_MOUNT' && state.isTamped && getDistance(pos, SNAP_TARGETS.grouphead) < SNAP_TARGETS.grouphead.radius) {
            // 吸附并锁定到冲煮头
            setItemTransform(dragInfo.el, SNAP_TARGETS.grouphead.x, SNAP_TARGETS.grouphead.y);
            state.portafilterMounted = true;
            state.currentStepIndex = 3; // 自动进入步骤 4：萃取
            matched = true;
          }
        } else if (dragInfo.key === 'tamper') {
          const pfPos = getItemPos(dom.items.portafilter);
          if (stepId === 'STEP_2_TAMP' && state.hasGrounds && getDistance(pos, { x: pfPos.x, y: pfPos.y - 25 }) < 75) {
            matched = true;
            executeTamp();
            return;
          }
        } else if (dragInfo.key === 'cup') {
          if (getDistance(pos, SNAP_TARGETS.brewcup) < SNAP_TARGETS.brewcup.radius) {
            setItemTransform(dragInfo.el, SNAP_TARGETS.brewcup.x, SNAP_TARGETS.brewcup.y);
            state.cupUnderSpout = true;
            matched = true;
          } else if (stepId !== 'STEP_4_BREW' && pos.y > 410 && pos.y < 515) {
            // 允许在步骤 4 之外将杯子放在吧台合适区域（例如拉花台）
            state.cupUnderSpout = false;
            matched = true;
          }
        } else if (dragInfo.key === 'milk') {
          const pitcherPos = getItemPos(dom.items.pitcher);
          if (stepId === 'STEP_5_POUR_MILK' && getDistance(pos, { x: pitcherPos.x, y: pitcherPos.y - 68 }) < 85) {
            matched = true;
            executePourMilk();
            return;
          }
        } else if (dragInfo.key === 'pitcher') {
          if (stepId === 'STEP_6_STEAM' && state.hasMilk && getDistance(pos, SNAP_TARGETS.steam) < SNAP_TARGETS.steam.radius) {
            setItemTransform(dragInfo.el, SNAP_TARGETS.steam.x, SNAP_TARGETS.steam.y);
            state.pitcherAtSteam = true;
            matched = true;
          } else if (stepId === 'STEP_7_LATTE_ART' && state.isSteamed) {
            const cupPos = getItemPos(dom.items.cup);
            if (getDistance(pos, { x: cupPos.x, y: cupPos.y - 58 }) < 85) {
              matched = true;
              executeLatteArt();
              return;
            }
          }
        }

        // 未命中有效目标区域，平滑返回拖拽前原位置
        if (!matched) {
          setItemTransform(dragInfo.el, dragInfo.originX, dragInfo.originY);
        }

        updateUI();
      }

      // =========================================================================
      // 8. 彻底重置工作台
      // =========================================================================
      function resetSimulator() {
        clearAllAsync();

        // 1. 重置全部状态变量
        state.currentStepIndex = 0;
        state.isBusy = false;
        state.portafilterSnappedAtGrinder = false;
        state.hasGrounds = false;
        state.isTamped = false;
        state.portafilterMounted = false;
        state.cupUnderSpout = true;
        state.hasEspresso = false;
        state.hasMilk = false;
        state.pitcherAtSteam = false;
        state.isSteamed = false;
        state.selectedPattern = null;

        // 2. 所有器具回到初始坐标
        setItemTransform(dom.items.cup, INITIAL_POS.cup.x, INITIAL_POS.cup.y, 0);
        setItemTransform(dom.items.portafilter, INITIAL_POS.portafilter.x, INITIAL_POS.portafilter.y, 0);
        setItemTransform(dom.items.tamper, INITIAL_POS.tamper.x, INITIAL_POS.tamper.y, 0);
        setItemTransform(dom.items.pitcher, INITIAL_POS.pitcher.x, INITIAL_POS.pitcher.y, 0);
        setItemTransform(dom.items.milk, INITIAL_POS.milk.x, INITIAL_POS.milk.y, 0);

        // 3. 清空咖啡粉、咖啡液、牛奶、奶泡与拉花图层
        dom.grinderBody.classList.remove('grinding-active');
        dom.groundsStream.setAttribute('opacity', '0');

        dom.pfGroundsLoose.setAttribute('opacity', '0');
        dom.pfGroundsLoose.setAttribute('d', 'M -26,-12 Q 0,-12 26,-12 Z');
        dom.pfGroundsTamped.setAttribute('opacity', '0');

        dom.espressoStreams.setAttribute('opacity', '0');
        dom.pressureNeedle.setAttribute('x2', '-14');
        dom.pressureNeedle.setAttribute('y2', '12');

        dom.cupLiquidRect.setAttribute('y', '36');
        dom.cupLiquidRect.setAttribute('height', '0');
        dom.cupCremaRect.setAttribute('y', '36');
        dom.cupCremaRect.setAttribute('height', '0');
        dom.cupTopSurface.setAttribute('opacity', '0');
        dom.cupMiniArt.setAttribute('opacity', '0');
        dom.cupMiniArt.innerHTML = '';

        dom.milkPourStream.setAttribute('opacity', '0');
        dom.lattePourStream.setAttribute('opacity', '0');

        dom.pitcherMilkRect.setAttribute('y', '50');
        dom.pitcherMilkRect.setAttribute('height', '0');
        dom.pitcherFoamRect.setAttribute('y', '50');
        dom.pitcherFoamRect.setAttribute('height', '0');
        dom.pitcherSwirl.setAttribute('opacity', '0');
        dom.pitcherSwirl.classList.remove('milk-swirl-active');
        dom.pitcherTempBar.setAttribute('width', '4');
        dom.pitcherTempBar.setAttribute('fill', '#38bdf8');

        dom.steamClouds.setAttribute('opacity', '0');
        dom.latteArtOverlay.setAttribute('opacity', '0');
        dom.latteArtCanvas.innerHTML = '';
        dom.finalArtTarget.innerHTML = '';

        // 4. 关闭完成弹窗并刷新界面
        dom.finishModal.classList.remove('visible');
        updateUI();
      }

      // =========================================================================
      // 9. 事件绑定与启动初始化
      // =========================================================================
      function init() {
        // 初始化可拖拽物品
        Object.entries(dom.items).forEach(([key, el]) => {
          setupDraggable(key, el);
        });

        // 绑定机器控制按钮
        dom.buttons.grind.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          executeGrind();
        });

        dom.buttons.brew.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          executeBrew();
        });

        dom.buttons.steam.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          executeSteamMilk();
        });

        // 绑定重置按钮
        dom.btnResetQuick.addEventListener('click', resetSimulator);
        dom.btnPlayAgain.addEventListener('click', resetSimulator);

        // 初始化坐标与状态机
        resetSimulator();
      }

      init();
    })();
  </script>
</body>
